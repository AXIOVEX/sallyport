# Syncyard Rust core workspace (spec 038).
#
# Crate set per spec 036 section 4 (coverage bars name these roles):
#   syncyard-contract  shared contract crate (bar 95%)
#   syncyard-daemon    gatekeeper daemon crate (bar 90%)
#   syncyard-cli       CLI crate (bar 85%)
#   syncyard-agent     backchannel agent crate (bar 85%)
#   syncyard-tray      tray/app crate (bar 80%)
# tools/syncyard-tracegen is a development tool (spec 036 T002), not a
# shipped component and not under the coverage bars.
#
# One version number across all components, from the repo VERSION file
# (spec 038 UPD-01): 0.4.0 at scaffold time.
[workspace]
resolver = "2"
members = [
    "crates/syncyard-contract",
    "crates/syncyard-daemon",
    "crates/syncyard-cli",
    "crates/syncyard-agent",
    "crates/syncyard-tray",
    "tools/syncyard-tracegen",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AXIOVEX/syncyard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syncyard-contract = { path = "crates/syncyard-contract" }
