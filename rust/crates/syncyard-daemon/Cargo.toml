[package]
name = "syncyard-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Syncyard gatekeeper daemon: RAM-authoritative job state over a Unix socket (spec 038)."

[features]
# Exposes the in-memory fake dispatcher for integration tests.
test-support = []

[dependencies]
syncyard-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
syncyard-daemon = { path = ".", features = ["test-support"] }
