[package]
name = "syncyard-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Syncyard tray/app: status presentation (spec 035) and job control (spec 037)."

[dependencies]
syncyard-contract = { path = "../syncyard-contract" }
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
# The control e2e drives the real daemon in-process (same
# test-support pattern as the agent and CLI suites).
syncyard-daemon = { path = "../syncyard-daemon", features = ["test-support"] }
syncyard-cli = { path = "../syncyard-cli" }
