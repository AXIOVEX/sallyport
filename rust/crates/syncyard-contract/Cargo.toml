[package]
name = "syncyard-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Syncyard shared contract: job/queue record types and the streaming-progress protocol (specs 034/038)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Spec 037 command-file signatures: per-host Ed25519 keys (the
# gatekeeper holds the public half). rand_core supplies OsRng
# for enrollment-time key generation only.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
