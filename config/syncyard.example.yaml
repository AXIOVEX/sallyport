# Syncyard configuration — a FICTIONAL example fleet (one
# Windows host, user "you", and its WSL2 distro). It doubles
# as the spec 010 FR-001 golden fixture: the built-in defaults
# in gatekeeper/config.py carry these same fictional values,
# and test_config.py proves the two agree. Real deployments
# copy this to `syncyard.yaml` beside the gatekeeper and put
# their real hosts and paths there — that file is local-only
# and is never committed (see .gitignore).
# Every key is optional: an absent key falls back to the
# built-in default, which is the value shown here unless a
# comment says otherwise. An invalid file fails closed with a
# named error — the gatekeeper never guesses.
#
# Types: hosts are windows | wsl2 | macos | linux | docker
# (spec 010 FR-003). This fleet has one Windows host and its
# WSL2 distro.

version: 1

# Repositories. door_repo is the PRIVATE repo whose workflows
# dispatch to your runners; project_repo is this project.
door_repo: electrohire/desktop-runner
project_repo: electrohire/syncyard

# GitHub API discipline. The fleet budget is one account-wide
# bucket; the sweep stands down rather than starve it.
budget:
  standdown_remaining: 1000   # below this: no dispatch
  critical_remaining: 500     # below this: no list call either
  reserve_for_completion: 0   # extra headroom kept for harvests

# Dispatch behaviour.
dispatch:
  max_active_dispatched: 2    # global cap (pre-lanes fleets)
  stale_dispatching_min: 10   # dispatching older than this is flagged
  lock_stale_min: 10
  duplicate_policy: refuse    # refuse | allow (same --key while active)
  soft_cap_min: 30            # jobs expected longer are announced first
  optimizer_ceiling: 100      # spec 013 FR-012: auto priorities cap here
  optimizer_aging_step_min: 10  # spec 013 FR-012: +1 auto priority per 10 min waited

# Script transport. Workflow inputs have a practical size
# ceiling (~54 KB observed); larger scripts must use the
# chunked transport helper (tools/chunked_transport).
transport:
  max_script_bytes: 49152

# Marker verdicts: a completed run's verdict lines match this
# pattern at line start. Verdicts come from markers, never
# from the run's success colour.
markers:
  pattern: "^[A-Z][A-Z0-9_]{2,}([ :]|$)"

# Host liveness (spec 011 FR-001). The gatekeeper reads each
# host's heartbeat (the backchannel heartbeat is the transport)
# on its sweep cadence and keeps its own last-seen record per
# host; `gk status` shows each host UP or DOWN with its
# heartbeat age. A host whose heartbeat is older than this
# many seconds is DOWN. DOWN only means it stopped reporting
# — the cause is recovery reconciliation's to determine.
# Failure mode: a non-positive or non-numeric value fails
# closed at load.
liveness:
  down_after_s: 900

# Controlled reboot (spec 011 FR-015). `gk reboot --host <host>`
# signals the host OS with this grace delay in seconds unless
# --delay overrides it, so in-flight uploads and log writes
# finish before the host goes down. The going-down record is
# always written before the signal. Failure mode: a
# non-positive or non-numeric value fails closed at load.
reboot:
  grace_s: 60

# Checkpoint hold (spec 013 FR-007). The cooperative job-level
# pause contract: at dispatch each script job is passed the
# venue path of its own hold file (holds_dir for its workflow
# + "<job-id>.hold"), and the transport workflow exports that
# path to the job's script as the env var named here. A job
# that polls the file stops at its next checkpoint, prints
# the marker, and exits with exit_code. The gatekeeper cannot
# pause an arbitrary running script mid-flight — the contract
# is cooperative, and a job that never polls the file is never
# paused by it. Failure mode: an exit code outside 1..255, a
# marker that is not a marker token, an invalid env var name,
# or a holds_dir naming an undeclared workflow fails closed
# at load. A workflow with no holds_dir entry gets no hold
# file (gk hold refuses it by name). A holds_dir entry is
# either one directory valid on every host, or a per-host
# mapping {host: directory} resolved through the job's lane
# host — run.yml needs the mapping because each Windows
# machine's holds tree lives in its own profile/layout, and
# one machine's path is not creatable by the other's runner
# identity.
checkpoint:
  exit_code: 86
  marker: CHECKPOINT_PAUSED
  env_var: SYNCYARD_HOLD_FILE
  holds_dir:
    run.yml:
      desktop: "C:\\Users\\you\\Development\\Syncyard\\holds"
      laptop: "C:\\Users\\you\\Development\\Syncyard\\holds"
    wsl.yml: /home/you/.syncyard/holds

# Host drain (spec 011 FR-005/FR-007). `gk drain --host <host>`
# holds dispatch to that one host, signals its running
# checkpoint-capable jobs (the spec 013 hold contract), waits
# out the window below (per lane when a lane overrides it),
# and prints a plain CLEAN / INTERRUPTING verdict. The drain
# hold then stands until `gk host-resume <host>` — it is
# host-scoped and separate from the pipeline pause/focus/drain
# of spec 013, which `gk resume` clears; neither clears the
# other. guard_stale_after_s bounds the host guard's heartbeat
# (spec 011 Phase 3): the guard beats into a host file the
# backchannel agent merges into its heartbeat payload, and a
# beat older than this relative to the carrying heartbeat is
# stale — ledgered once per transition and shown in status, so
# a stopped guard is never a silent loss of protection.
# Failure mode: a non-positive window, a per-lane override for
# an undeclared lane, or a non-positive staleness bound fails
# closed at load.
drain:
  window_s: 120
  per_lane_window_s: {}
  guard_stale_after_s: 180
# Lane priority lock (spec 015 FR-007). `gk lock --lane
# <lane> --program <program>` gives one program exclusive
# dispatch on a lane until it releases, the operator
# overrides, or the lock expires. Every lock carries a TTL
# so a forgotten claim cannot squat a lane forever: a lock
# taken without --ttl-min gets the default; a --ttl-min
# outside [1, max_ttl_min] is refused. Failure mode: a
# non-integer, non-positive value, or a default above the
# maximum, fails closed at load.
lock:
  default_ttl_min: 240
  max_ttl_min: 1440

# Hosts. Each host names its type, the transport workflows it
# serves (execute = run a script, grab = return a file), the
# identity markers its venues prove themselves with, and its
# default working directories per workflow. `desktop` is the
# fleet's Windows host; `desktop-wsl` is its WSL2 distro,
# reached through it (its workflows ride the via host's
# runner). A job addressed to a lane runs on that lane's host
# or is refused — never silently rerouted (FR-004).
hosts:
  desktop:
    type: windows
    workflows:
      run.yml: execute
      wsl.yml: execute
      grab.yml: grab
    identity: [LID_HOST, LID_WINUSER, LID_OS]
    cwd:
      run.yml: "C:\\Users\\you"
      grab.yml: null
  desktop-wsl:
    type: wsl2
    via: desktop
    distro: Ubuntu-24.04
    workflows:
      wsl.yml: execute
      grab.yml: grab
    identity: [LID_HOST, LID_WSLUSER, LID_OS]
    cwd:
      wsl.yml: /home/you

# Workflows available for dispatch, by file name.
workflows:
  - run.yml
  - wsl.yml
  - grab.yml

# --- Adopter examples (not this fleet) -----------------------
# A Linux host and lane (uncomment and adjust; also add
# linux.yml to the workflows list above):
# hosts:
#   linuxbox:
#     type: linux
#     workflows:
#       linux.yml: execute
#       grab.yml: grab
#     identity: [LID_HOST, LID_USER, LID_OS]
#     cwd:
#       linux.yml: /home/you
# lanes:
#   linuxlane:
#     host: linuxbox
#     runner_label: lane-linuxlane
#     queued: [20, 45]
#     executing:
#       mode: fixed
#       values: [45, 90]
#
# A Docker venue — a named image run on any runner carrying
# its lane label (the image is the venue; jobs may name their
# own with `submit --image`, falling back to the host's image
# here; also add docker.yml above):
# hosts:
#   dock:
#     type: docker
#     image: debian:bookworm-slim
#     workflows:
#       docker.yml: execute
#       grab.yml: grab
#     identity: [LID_HOST, LID_IMAGE, LID_OS]
#     cwd:
#       docker.yml: /

# Lanes (spec 010 FR-002; spec 016 FR-001/FR-002). Lanes live
# in named PROFILES; exactly one profile is active. A profile
# is a lane table: each lane names its host, runner label,
# concurrency (1 = serial unless a lane says otherwise),
# resource class (cpu|gpu|any) and expected-duration band in
# minutes ([lo, hi], either end null = open) for auto routing,
# an optional workflow pin, and an enabled flag. Watermarks
# are minutes: queued/executing (warn, escalate); executing
# mode is `fixed` (table values) or `expectation` (the job's
# declared expectation scaled, floored by `floor`). Switching
# the active profile is a config edit; it takes effect at the
# next sweep. `auto_default: true` makes a lane-less submit
# mean --lane auto (default false: a lane is required).
# `capability_max_age_min` is how old a host capability probe
# may be before auto routing treats it as unknown.
lanes:
  active_profile: fleet-default
  auto_default: false
  capability_max_age_min: 60
  profiles:
    fleet-default:
      quick:
        host: desktop
        runner_label: lane-quick
        concurrency: 1
        resource_class: cpu
        duration_band: [0, 10]
        queued: [10, 30]
        executing:
          mode: fixed
          values: [5, 15]
      normal:
        host: desktop
        runner_label: lane-normal
        concurrency: 1
        resource_class: cpu
        duration_band: [0, 45]
        queued: [20, 45]
        executing:
          mode: fixed
          values: [45, 90]
      long:
        host: desktop
        runner_label: lane-long
        concurrency: 1
        resource_class: cpu
        duration_band: [30, null]
        queued: [45, 120]
        executing:
          mode: expectation
          floor: [90, 180]
      gpu:
        host: desktop
        runner_label: lane-gpu
        concurrency: 1
        resource_class: gpu
        duration_band: [0, null]
        queued: [30, 90]
        executing:
          mode: expectation
          floor: [120, 240]
    single-host-light:
      quick:
        host: desktop
        runner_label: lane-quick
        concurrency: 1
        resource_class: cpu
        duration_band: [0, 10]
        queued: [10, 30]
        executing:
          mode: fixed
          values: [5, 15]
      long:
        host: desktop
        runner_label: lane-long
        concurrency: 1
        resource_class: any
        duration_band: [10, null]
        queued: [45, 120]
        executing:
          mode: expectation
          floor: [90, 180]
    gpu-farm:
      quick:
        host: desktop
        runner_label: lane-quick
        concurrency: 1
        resource_class: cpu
        duration_band: [0, 10]
        queued: [10, 30]
        executing:
          mode: fixed
          values: [5, 15]
      gpu:
        host: desktop
        runner_label: lane-gpu
        concurrency: 2
        resource_class: gpu
        duration_band: [0, 120]
        queued: [30, 90]
        executing:
          mode: expectation
          floor: [120, 240]
      gpu-long:
        host: desktop
        runner_label: lane-gpu-long
        concurrency: 1
        resource_class: gpu
        duration_band: [60, null]
        queued: [30, 90]
        executing:
          mode: expectation
          floor: [240, 360]

# Notification endpoints (spec 010 FR-007). Programs register
# an endpoint name on submit; the outbox delivers per type.
# type chat = a Muse chat id (this fleet's vehicle);
# other types: webhook (URL), file (append path),
# command (argv prefix receiving the message on stdin).
endpoints: {}

# Retention.
retention:
  human_log_max_bytes: 1000000
