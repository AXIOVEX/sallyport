schema_version: '1.0'

extension:
  id: aee
  name: Applied Epistemic Engineering
  version: 1.7.0
  description: Challenge claims, trace evidence, propagate uncertainty, and route epistemic failures across phases
  category: process
  effect: read-write
  author: ElectroHire
  repository: https://github.com/electrohire/spec-kit-aee
  license: MIT
  homepage: https://github.com/electrohire/spec-kit-aee

requires:
  speckit_version: '>=1.0.0,<2'
  tools:
    - name: python
      required: true
      version: '>=3.11'
    # CLI supplied by https://github.com/electrohire/applied-epistemic-engineering
    # 1.0.2 introduced the gaps command; 1.4.0 introduced the policy
    # gates, reliability blending, and review subcommand; 1.5.0 is
    # the realigned engine (Spec 004 vocabulary: lifecycle
    # stages, stage-capped reported statuses, lane-paired outcomes,
    # not_understood, methodology 2.0); 1.6.0 computes the lane-1
    # outcome from lane-1 facts alone (it no longer copies the
    # headline), adds the gate's --require-lane1-pass option, and
    # carries methodology 2.1 - the floor moves to it so engines
    # whose lane 1 cannot show its own result are refused cleanly.
    # Spec Kit installs no
    # Python packages, so the runner provisions this range itself into
    # .specify/extensions/aee/.runtime when the invoking Python lacks it,
    # together with jsonschema>=4.0 for the evaluator composer that
    # `run_aee.py compose` runs there.
    - name: aee
      required: true
      version: '>=1.6.0,<2'
    # Spec Kit extension, not a shell executable. REQUIRED companion:
    # AEE is one evaluator among many by design, and its results are
    # composed through the common evaluator extension so every
    # evaluator's output is handled consistently. The contract alone
    # would leave that consistency opt-in, so the pair is one system:
    # this manifest declares the evaluator extension required and the
    # runner's assess enforces it. When the extension is missing, assess
    # installs the pinned, SHA-256-verified release through
    # `specify extension add`, and refuses (exit 2) only when that is
    # disabled (SPECKIT_AEE_AUTO_INSTALL=0) or fails.
    # https://github.com/electrohire/spec-kit-evaluator
    - name: spec-kit-evaluator
      required: true
      version: '>=1.0.0,<2'
    # Optional token-economy tools. AEE cores the policy (measured-only
    # savings, cite-original-lines evidence) and depends on the tools; every
    # workflow degrades gracefully when one is absent. Informational only:
    # Spec Kit does not auto-install these dependencies.
    # rtk: https://github.com/rtk-ai/rtk - shell-output compression.
    - name: rtk
      required: false
    # headroom: https://github.com/headroomlabs-ai/headroom - long-horizon
    # session compression. See docs/token-economy.md for integration points.
    - name: headroom
      required: false
    # token-router: https://github.com/sleeplesshan/token-router - local
    # Ollama line router for evidence gathering.
    - name: token-router
      required: false
    - name: ollama
      required: false

provides:
  commands:
    - name: speckit.aee.draft-claims
      file: commands/speckit.aee.draft-claims.md
      description: Draft atomic claims from a spec's requirements for human ratification; drafts are born draft and are never upgraded by the tool
    - name: speckit.aee.assess
      file: commands/speckit.aee.assess.md
      description: Assess explicit claims and emit both a rich AEE assessment and an Evaluator Contract result
    - name: speckit.aee.challenge
      file: commands/speckit.aee.challenge.md
      description: Adversarially challenge atomicity, boundaries, falsifiability, dependencies, and evidence independence
    - name: speckit.aee.trace
      file: commands/speckit.aee.trace.md
      description: Render the claim dependency graph and inspect epistemic provenance
    - name: speckit.aee.verify
      file: commands/speckit.aee.verify.md
      description: Verify the tamper-evident AEE ledger without claiming that its contents are true
    - name: speckit.aee.gate
      file: commands/speckit.aee.gate.md
      description: Apply a CI-friendly decision gate to an AEE assessment
    - name: speckit.aee.review
      file: commands/speckit.aee.review.md
      description: Diff two AEE assessments into a materiality-filtered review queue
    - name: speckit.aee.gaps
      file: commands/speckit.aee.gaps.md
      description: Generate or update the gap register from a verification matrix and test evidence
    - name: speckit.aee.route-evidence
      file: commands/speckit.aee.route-evidence.md
      description: Route oversized logs and sources into raw evidence slices for AEE gates
    - name: speckit.aee.report-savings
      file: commands/speckit.aee.report-savings.md
      description: Report measured RTK and Headroom token savings, never estimated
    - name: speckit.aee.message-security
      file: commands/speckit.aee.message-security.md
      description: Run the message-security battery gate and check a spec's authority surface
  templates:
    - name: aee-claims
      file: templates/aee-claims.json
      description: Structured claim and evidence input for the AEE engine
    - name: message-security-authority-surface
      file: templates/message-security-authority-surface.md
      description: Authority-surface spec section - who may instruct the system, through which channels, which actions and destinations are authorized
    - name: message-security-challenge-record
      file: templates/message-security-challenge-record.json
      description: Example message-security challenge record (span hash, source, claim, check fired, verdict, action taken, timestamp)
    - name: message-security-challenge-record-schema
      file: templates/message-security-challenge-record.schema.json
      description: JSON Schema for the append-only message-security challenge record format
  config:
    - name: aee-config.yml
      template: templates/aee-config.template.yml
      description: AEE thresholds, ledger behavior, and lifecycle settings
      required: false
  scripts:
    - name: aee-runner
      file: scripts/python/run_aee.py
      description: Path-safe adapter for the applied-epistemic-engineering CLI
      runtimes:
        - python
    - name: aee-token-economy
      file: scripts/python/aee_token_economy.py
      description: Policy layer over optional token-economy tools (rtk, headroom, token-router)
      runtimes:
        - python
    - name: message-security-screen
      file: scripts/python/message_security_screen.py
      description: Deterministic message-security screener - structural layer L1 and epistemic layer L2 over tagged spans
      runtimes:
        - python
    - name: message-security-battery
      file: scripts/python/message_security_battery.py
      description: Planted-injection battery assessment gate over the vendored screener (bars stated in the script)
      runtimes:
        - python

# Hooks bind no arguments; the artifact and phase each hook expects
# (including the after_verify matrix/evidence defaults and its stop
# condition) are specified in docs/usage.md, "Hook expectations".
hooks:
  after_specify:
    command: speckit.aee.assess
    priority: 30
    optional: true
    prompt: Run an epistemic assessment of the specification?
    description: Challenge requirements, assumptions, boundaries, and evidence after specification
  after_plan:
    command: speckit.aee.assess
    priority: 30
    optional: true
    prompt: Run an epistemic assessment of the plan?
    description: Challenge plan claims, decisions, dependencies, and supporting evidence
  after_tasks:
    command: speckit.aee.assess
    priority: 30
    optional: true
    prompt: Run an epistemic assessment of the task breakdown?
    description: Challenge task traceability and the evidence required to verify completion
  after_implement:
    command: speckit.aee.assess
    priority: 30
    optional: true
    prompt: Run an epistemic assessment of the implementation?
    description: Compare implementation claims with independently inspectable evidence
  after_verify:
    command: speckit.aee.gaps
    priority: 40
    optional: true
    prompt: Regenerate the gap register from verification evidence?
    description: Cross-reference the verification matrix against test evidence and update GAPS.md

tags:
  - epistemics
  - evidence
  - provenance
  - uncertainty
  - governance
