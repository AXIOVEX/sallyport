# Syncyard standalone distribution (spec 017).
#
# The package and the checkout are the same code: the
# [tool.setuptools] package-dir mapping below installs the
# literal files from gatekeeper/ and backchannel/ as the
# `syncyard` and `syncyard.backchannel` namespace packages.
# Nothing is copied, generated, or transformed at build time,
# and gatekeeper/gk.py + gatekeeper/config.py are never
# edited for packaging (spec 017 FR-003 / FR-010).
#
# The version is read from the repo VERSION file at build
# time (see [tool.setuptools.dynamic]); VERSION is the
# project's single version source, so a version bump needs
# no packaging edit.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncyard"
dynamic = ["version"]
description = "Synchronized, gated dispatch to your own machines: self-hosted CPU/GPU runner lanes plus an API-budget gatekeeper for agent workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "ElectroHire, Inc." },
]
keywords = ["github-actions", "self-hosted-runners", "agents", "dispatch", "gatekeeper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/electrohire/syncyard"
Repository = "https://github.com/electrohire/syncyard"
Documentation = "https://syncyard.readthedocs.io"
Issues = "https://github.com/electrohire/syncyard/issues"

[project.scripts]
# The console command IS the gatekeeper: this entry point is a
# reference to gk.py's own main(), not a wrapper (spec 017 FR-002).
syncyard = "syncyard.gk:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
# PEP 420 namespace packages over the existing directories.
# gk.py loads config.py by file path from its own directory,
# so the sibling relationship this mapping preserves is the
# only layout requirement (spec 017 plan.md section 1-2).
package-dir = { syncyard = "gatekeeper", "syncyard.backchannel" = "backchannel" }
packages = ["syncyard", "syncyard.backchannel"]
