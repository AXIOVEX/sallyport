# Read the Docs configuration.
# The repository side is complete in this file plus mkdocs.yml;
# the project itself is imported on readthedocs.org under the
# owner's account.
version: 2

build:
  os: ubuntu-22.04
  tools:
    - python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
