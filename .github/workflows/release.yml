# Syncyard release pipeline - PyPI (spec 017 FR-004).
# GitHub-HOSTED runners only, always (see SECURITY.md).
#
# Triggers:
#   - push of a v* tag: build, check, smoke, then PUBLISH via
#     OIDC trusted publishing. No PyPI password or API token is
#     stored anywhere; the publish job mints a short-lived
#     id-token for the run.
#   - workflow_dispatch: the same pipeline as a dry run - every
#     step except publishing.
# Until a tag is pushed, this workflow does nothing.
#
# First publish additionally requires the owner's one-time
# trusted-publisher registration on pypi.org (spec 017 FR-005).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a clean venv and smoke it
        run: |
          set -e
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --no-index --find-links dist syncyard
          /tmp/smoke-venv/bin/syncyard --help > /dev/null
          /tmp/smoke-venv/bin/syncyard status
          /tmp/smoke-venv/bin/python -c "
          import importlib.metadata as m
          import syncyard.config, syncyard.backchannel.bc
          cfg = syncyard.config.load_config()
          assert cfg['door_repo'], 'config defaults failed to load'
          print('installed syncyard', m.version('syncyard'))
          "

  publish:
    name: publish
    # Only a real tag push publishes; the workflow_dispatch dry
    # run stops after build + smoke.
    if: github.event_name == 'push'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/syncyard
    permissions:
      id-token: write # OIDC trusted publishing; no stored token
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
