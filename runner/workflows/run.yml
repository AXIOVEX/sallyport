# Syncyard run workflow - version 0.3.0
# Part of electrohire/syncyard. Dispatch-only by design: this workflow binds
# self-hosted runners and must NEVER be triggered by pull_request,
# pull_request_target, issues, or any other unprivileged event.
# See SECURITY.md - the security model depends on it.
#
# Host contract (spec 010 FR-003): the `lane` input addresses the
# runner; any Windows host whose runner carries that lane label can
# serve this transport. The gatekeeper always passes cwd explicitly
# (from the host's config cwd map); the default below is only a
# fallback for manual dispatch. Job scripts prove the venue with
# the host's identity markers (config: hosts.<name>.identity).
name: run

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Runner lane label (from the gatekeeper's config)"
        required: false
        default: 'lane-long'
      cmd_b64:
        description: "Base64-encoded PowerShell script to execute on the addressed Windows host"
        required: true
      cwd:
        description: "Working directory"
        required: false
        default: 'C:\Users\trist'
      hold_file:
        description: "Checkpoint hold-signal path on this host (spec 013 FR-007); the job reads it via $env:SYNCYARD_HOLD_FILE"
        required: false

jobs:
  run:
    runs-on: [self-hosted, "${{ inputs.lane }}"]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require PowerShell 7
        shell: cmd
        run: |
          set "PWSH7=%ProgramFiles%\PowerShell\7\pwsh.exe"
          if exist "%PWSH7%" goto :ps7verify
          set "PWSH7="
          for /f "delims=" %%P in ('where pwsh 2^>nul') do if not defined PWSH7 set "PWSH7=%%P"
          if defined PWSH7 goto :ps7verify
          echo SYNCYARD_PS7_MISSING: PowerShell 7 is required on this host and pwsh.exe was not found.
          echo SYNCYARD_PS7_MISSING: Run runner\ensure-powershell7.cmd from electrohire/syncyard to install it, then re-dispatch. Windows PowerShell 5.1 is not supported by Syncyard.
          exit /b 1
          :ps7verify
          "%PWSH7%" -NoProfile -Command "if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) { exit 1 }"
          if errorlevel 1 exit /b 1
          echo SYNCYARD_PS7_PREFLIGHT_OK exe=%PWSH7%
      - name: Execute
        shell: pwsh
        working-directory: ${{ inputs.cwd }}
        env:
          CMD_B64: ${{ inputs.cmd_b64 }}
          SYNCYARD_HOLD_FILE: ${{ inputs.hold_file }}
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) { throw "SYNCYARD_PS7_REQUIRED: Syncyard jobs run under PowerShell 7 (Core) only; this step is running $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion). Windows PowerShell 5.1 is not supported." }
          $pwsh7 = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
                    if (-not (Test-Path $pwsh7)) { $pwshCmd = Get-Command pwsh -ErrorAction SilentlyContinue; if ($pwshCmd) { $pwsh7 = $pwshCmd.Source } }
          if (-not (Test-Path $pwsh7)) { throw "SYNCYARD_PS7_MISSING: pwsh.exe not found on this host (neither the canonical install path nor PATH, where the Store/MSIX install registers). Run runner\ensure-powershell7.cmd from electrohire/syncyard to install PowerShell 7, then re-dispatch." }
          if ([int](& $pwsh7 -NoProfile -Command '$PSVersionTable.PSVersion.Major') -lt 7) { throw "SYNCYARD_PS7_REQUIRED: $pwsh7 is not PowerShell 7." }
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:CMD_B64))
          if ($env:SYNCYARD_HOLD_FILE) { New-Item -ItemType Directory -Force -Path (Split-Path $env:SYNCYARD_HOLD_FILE) | Out-Null }
          # Running-job registry (spec 011 Phase 3): while this
          # job runs, an entry file in the `running` dir beside
          # the holds dir names it — that registry is how the
          # host guard learns, locally and in seconds, which
          # checkpoint-capable jobs are live on this host (and
          # where each one's hold file lives). Best-effort: a
          # registration failure degrades guard coverage, never
          # the job. The entry is removed when the job ends;
          # an entry orphaned by a host kill is stale by its
          # `started` stamp and the guard ages it out.
          $regFile = $null
          if ($env:SYNCYARD_HOLD_FILE) {
            try {
              $jid = [IO.Path]::GetFileNameWithoutExtension($env:SYNCYARD_HOLD_FILE)
              $regDir = Join-Path (Split-Path (Split-Path $env:SYNCYARD_HOLD_FILE)) 'running'
              New-Item -ItemType Directory -Force -Path $regDir | Out-Null
              $regFile = Join-Path $regDir "$jid.entry"
              $lines = @("job_id=$jid", "run_id=${{ github.run_id }}", "workflow=run.yml", "lane=${{ inputs.lane }}", "hold_file=$env:SYNCYARD_HOLD_FILE", "hold_file_win=$env:SYNCYARD_HOLD_FILE", "started=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))")
              Set-Content -Path "$regFile.tmp" -Value $lines -Encoding UTF8
              Move-Item -Force "$regFile.tmp" $regFile
            } catch { $regFile = $null }
          }
          $f = Join-Path $env:RUNNER_TEMP 'job.ps1'
          Set-Content -Path $f -Value $script -Encoding UTF8
          & $pwsh7 -NoProfile -ExecutionPolicy Bypass -File $f
          $rc = $LASTEXITCODE
          if ($regFile) { Remove-Item -Force -ErrorAction SilentlyContinue $regFile }
          exit $rc
