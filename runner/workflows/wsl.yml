# Syncyard wsl workflow - version 0.3.0
# Part of AXIOVEX/syncyard. Dispatch-only by design: this workflow binds
# self-hosted runners and must NEVER be triggered by pull_request,
# pull_request_target, issues, or any other unprivileged event.
# See SECURITY.md - the security model depends on it.
#
# Host contract (spec 010 FR-003/FR-004): a WSL2 venue rides its
# Windows host's runner — this workflow runs on the Windows runner
# addressed by the `lane` input and hops into the host's default
# WSL2 distro. The gatekeeper always passes cwd explicitly (from
# the wsl2 host's config cwd map); the default below is only a
# fallback for manual dispatch.
name: wsl

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Runner lane label (from the gatekeeper's config)"
        required: false
        default: 'lane-long'
      cmd_b64:
        description: "Base64-encoded bash script to execute inside the host's WSL2 distro"
        required: true
      cwd:
        description: "WSL working directory"
        required: false
        default: '/home/tpierson'
      hold_file:
        description: "Checkpoint hold-signal path inside the distro (spec 013 FR-007); the job reads it via $SYNCYARD_HOLD_FILE"
        required: false

jobs:
  wsl:
    runs-on: [self-hosted, "${{ inputs.lane }}"]
    timeout-minutes: 360
    steps:
      - name: Require PowerShell 7
        shell: cmd
        run: |
          set "PWSH7=%ProgramFiles%\PowerShell\7\pwsh.exe"
          if exist "%PWSH7%" goto :ps7verify
          set "PWSH7="
          for /f "delims=" %%P in ('where pwsh 2^>nul') do if not defined PWSH7 set "PWSH7=%%P"
          if defined PWSH7 goto :ps7verify
          echo SYNCYARD_PS7_MISSING: PowerShell 7 is required on this host and pwsh.exe was not found.
          echo SYNCYARD_PS7_MISSING: Run runner\ensure-powershell7.cmd from AXIOVEX/syncyard to install it, then re-dispatch. Windows PowerShell 5.1 is not supported by Syncyard.
          exit /b 1
          :ps7verify
          "%PWSH7%" -NoProfile -Command "if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) { exit 1 }"
          if errorlevel 1 exit /b 1
          echo SYNCYARD_PS7_PREFLIGHT_OK exe=%PWSH7%
      - name: Execute-WSL
        shell: pwsh
        env:
          CMD_B64: ${{ inputs.cmd_b64 }}
          WSL_CWD: ${{ inputs.cwd }}
          HOLD_FILE: ${{ inputs.hold_file }}
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) { throw "SYNCYARD_PS7_REQUIRED: Syncyard jobs run under PowerShell 7 (Core) only; this step is running $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion). Windows PowerShell 5.1 is not supported." }
          $pwsh7 = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
                    if (-not (Test-Path $pwsh7)) { $pwshCmd = Get-Command pwsh -ErrorAction SilentlyContinue; if ($pwshCmd) { $pwsh7 = $pwshCmd.Source } }
          if (-not (Test-Path $pwsh7)) { throw "SYNCYARD_PS7_MISSING: pwsh.exe not found on this host (neither the canonical install path nor PATH, where the Store/MSIX install registers). Run runner\ensure-powershell7.cmd from AXIOVEX/syncyard to install PowerShell 7, then re-dispatch." }
          if ([int](& $pwsh7 -NoProfile -Command '$PSVersionTable.PSVersion.Major') -lt 7) { throw "SYNCYARD_PS7_REQUIRED: $pwsh7 is not PowerShell 7." }
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:CMD_B64))
          $f = Join-Path $env:RUNNER_TEMP 'job.sh'
          [IO.File]::WriteAllText($f, ($script -replace "`r`n","`n"))
          # Manual Windows->WSL path conversion (wslpath strips backslashes via pwsh arg passing)
          $wslPath = '/mnt/' + $f.Substring(0,1).ToLower() + ($f.Substring(2) -replace '\\','/')
          $inner = "cd '$env:WSL_CWD' && bash '$wslPath'"
          $regFileWsl = $null
          if ($env:HOLD_FILE) {
            $holdDir = $env:HOLD_FILE.Substring(0, $env:HOLD_FILE.LastIndexOf('/'))
            $inner = "mkdir -p '$holdDir' && SYNCYARD_HOLD_FILE='$env:HOLD_FILE' $inner"
            # Running-job registry (spec 011 Phase 3): same
            # contract as run.yml — an entry in the `running`
            # dir beside the holds dir while the job runs, so
            # the host guard can find this job and its hold
            # file locally. Written from here over the WSL UNC
            # path (the distro is running: this job is in it).
            # Best-effort: failure degrades guard coverage,
            # never the job; the entry is removed at job end
            # and ages out by its `started` stamp if orphaned.
            try {
              $jid = [IO.Path]::GetFileNameWithoutExtension($env:HOLD_FILE)
              $parent = $holdDir.Substring(0, $holdDir.LastIndexOf('/'))
              $distro = ((wsl.exe --list --quiet | Where-Object { $_ -match '\S' } | Select-Object -First 1) -replace "`0", "").Trim()
              $uncDir = '\\wsl.localhost\' + $distro + ($parent -replace '/', '\') + '\running'
              New-Item -ItemType Directory -Force -Path $uncDir | Out-Null
              $regFileWsl = Join-Path $uncDir "$jid.entry"
              $lines = @("job_id=$jid", "run_id=${{ github.run_id }}", "workflow=wsl.yml", "lane=${{ inputs.lane }}", "hold_file=$env:HOLD_FILE", "hold_file_win=\\wsl.localhost\$distro" + ($env:HOLD_FILE -replace '/', '\'), "started=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))")
              Set-Content -Path "$regFileWsl.tmp" -Value $lines -Encoding UTF8
              Move-Item -Force "$regFileWsl.tmp" $regFileWsl
            } catch { $regFileWsl = $null }
          }
          & wsl.exe -- bash -lc $inner
          $rc = $LASTEXITCODE
          if ($regFileWsl) { Remove-Item -Force -ErrorAction SilentlyContinue $regFileWsl }
          exit $rc
