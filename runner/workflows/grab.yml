# Syncyard grab workflow - version 0.2.1
# 0.2.1 (2026-11-09, owner order): the upload carries retention-days: 1.
# A grabbed file is transport only (the gatekeeper harvests it and then
# deletes the artifact); a missed cleanup must self-expire in a day
# instead of sitting for the 90-day default that built the 2026-11-09
# artifact backlog (190 artifacts, ~952 MB, quota exhausted).
# Part of electrohire/syncyard. Dispatch-only by design: this workflow binds
# self-hosted runners and must NEVER be triggered by pull_request,
# pull_request_target, issues, or any other unprivileged event.
# See SECURITY.md - the security model depends on it.
#
# The file-return transport for every host type (spec 010 FR-003):
# runs on the runner addressed by the `lane` input and returns the
# addressed host's file as an artifact. For a WSL2 venue the path
# is the file's UNC path through the Windows host.
name: grab

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Runner lane label (from the gatekeeper's config)"
        required: false
        default: 'lane-long'
      path:
        description: "File path on the addressed host to return as an artifact"
        required: true

jobs:
  grab:
    runs-on: [self-hosted, "${{ inputs.lane }}"]
    timeout-minutes: 10
    steps:
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grabbed-file
          path: ${{ inputs.path }}
          if-no-files-found: error
          retention-days: 1
