# Syncyard grab workflow - version 0.1.2
# 0.1.2 (2026-11-09, owner order): the upload carries retention-days: 1;
# grabbed files are transport only and must self-expire in a day, not
# the 90-day default (see the 2026-11-09 artifact backlog purge).
# Part of electrohire/syncyard. Dispatch-only by design: this workflow binds
# self-hosted runners and must NEVER be triggered by pull_request,
# pull_request_target, issues, or any other unprivileged event.
# See SECURITY.md - the security model depends on it.
name: grab

on:
  workflow_dispatch:
    inputs:
      path:
        description: "File path on the desktop to return as an artifact"
        required: true

jobs:
  grab:
    runs-on: [self-hosted, Windows, X64, desktop, gpu]
    timeout-minutes: 10
    steps:
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grabbed-file
          path: ${{ inputs.path }}
          if-no-files-found: error
          retention-days: 1
